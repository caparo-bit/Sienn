<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Smart TD - Monitor</title>

    <!-- ====== PWA: manifest e iconos ====== -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#1f8a3c" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Smart TD" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- ====== fin bloque PWA ====== -->

    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Roboto,system-ui,sans-serif; }
        body { background:#08111f; min-height:100vh; display:flex; justify-content:center; align-items:flex-start; padding:12px; }
        .app { max-width:480px; width:100%; background:#0c1526; border-radius:22px; padding:0 0 16px; color:#f0f4fa; box-shadow:0 10px 30px rgba(0,0,0,0.6); overflow:hidden; position:relative; }
        .header { background:#1f8a3c; padding:12px 14px 10px; display:flex; align-items:center; justify-content:space-between; }
        .header .back { font-size:1.3rem; color:#eafff0; width:28px; }
        .header .title { font-weight:700; font-size:1.05rem; letter-spacing:0.3px; text-align:center; flex:1; cursor:default; }
        .header .filter { font-size:1.1rem; color:#eafff0; width:28px; text-align:right; }
        .header-strip { height:3px; background:linear-gradient(90deg,#f4a623,#f4a623 60%,transparent 60%); }
        .subbar { display:flex; justify-content:space-between; align-items:center; padding:6px 14px; background:#0c1526; font-size:0.72rem; color:#7fa6c9; }
        .status-badge { font-size:0.7rem; padding:2px 10px; border-radius:30px; font-weight:600; }
        .status-badge.online { background:#0f7b3a; color:#e0f2e0; }
        .status-badge.offline { background:#7b1f1f; color:#fcd0d0; }
        .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; }
        .dot.online { background:#22c55e; animation:pulse 1.5s infinite; }
        .dot.offline { background:#ef4444; }
        @keyframes pulse { 0%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.8)} 100%{opacity:1;transform:scale(1)} }
        .content { padding:0 14px; }
        .btn-grid { display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:8px; margin-top:14px; }
        .btn-grid .btn { background:#1e3a5a; border:none; border-radius:40px; padding:12px 0; color:#eaf2fa; font-weight:600; font-size:0.72rem; text-align:center; transition:all 0.15s; box-shadow:0 4px 6px rgba(0,0,0,0.3); cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent; }
        .btn-grid .btn:active { transform:scale(0.94); background:#2a4a6a; }
        .table-wrap { margin-top:16px; background:#0f1f33; border-radius:16px; padding:4px 0 2px; border:1px solid #1e3a5a; overflow-x:auto; }
        table { width:100%; border-collapse:collapse; font-size:0.85rem; color:#d6e6f5; }
        thead th { text-align:center; font-weight:700; padding:8px 4px 6px; border-bottom:1px solid #1e3a5a; font-size:0.85rem; letter-spacing:0.5px; }
        thead th.col-p { color:#4fa8ff; }
        thead th.col-z { color:#f4c542; }
        thead th.col-s { color:#f45c5c; }
        thead th.col-r { color:#4fd67a; }
        td { text-align:center; padding:9px 4px; border-bottom:1px solid #16283f; font-weight:600; }
        .row-label { text-align:left; padding-left:10px; font-weight:700; color:#d6e6f5; white-space:nowrap; }
        .num { font-weight:700; color:#5c7ea0; }
        .num.pos-p { color:#4fa8ff; }
        .num.pos-z { color:#f4c542; }
        .num.pos-s { color:#f45c5c; }
        .num.pos-r { color:#4fd67a; }
        tr.current-zone { background:#2f5fb0; }
        tr.current-zone td, tr.current-zone .row-label { color:#ffffff; }
        tr.current-zone .num { color:#eaf2fa; }
        .tiles { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:16px; }
        .tile { background:#274a7a; border-radius:14px; padding:14px 4px 10px; text-align:center; }
        .tile .tile-icon { font-size:1.4rem; margin-bottom:6px; }
        .tile .tile-count { font-size:1.3rem; font-weight:800; color:#fff; }
        .tile .tile-label { font-size:0.62rem; letter-spacing:0.5px; color:#c7d9ee; margin-top:2px; font-weight:600; }
        .foot-strip { display:flex; align-items:center; justify-content:space-between; margin-top:14px; padding:6px 4px 0; }
        .foot-icons { display:flex; gap:16px; font-size:1.15rem; color:#7fa6c9; }
        .foot-icons span { cursor:pointer; }
        .libre-btn { background:#0f7b3a; color:#fff; font-weight:800; font-size:0.85rem; padding:10px 26px; border-radius:40px; cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent; box-shadow:0 4px 6px rgba(0,0,0,0.3); }
        .libre-btn:active { transform:scale(0.94); background:#0e6a32; }
        .toast { margin:14px 14px 0; padding:8px 12px; border-radius:30px; background:#1e3a5a; color:#b3d9ff; font-size:0.75rem; text-align:center; transition:all 0.3s; min-height:34px; display:flex; align-items:center; justify-content:center; gap:8px; }
        .toast.success { background:#0f7b3a; color:#e0f2e0; }
        .toast.error { background:#7b1f1f; color:#fcd0d0; }
        .toast.warning { background:#b45309; color:#fff3e0; }

        .modal-overlay {
            position:absolute;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.75);
            display:flex;
            align-items:center;
            justify-content:center;
            z-index:1000;
            border-radius:22px;
            backdrop-filter:blur(4px);
            opacity:0;
            pointer-events:none;
            transition:opacity 0.25s ease;
        }
        .modal-overlay.active {
            opacity:1;
            pointer-events:auto;
        }
        .modal-box {
            background:#0f1f33;
            width:92%;
            max-height:85%;
            border-radius:24px;
            padding:20px 18px 18px;
            border:1px solid #2a4a7a;
            box-shadow:0 20px 40px rgba(0,0,0,0.7);
            display:flex;
            flex-direction:column;
            overflow:hidden;
        }
        .modal-box .modal-title {
            font-size:1.2rem;
            font-weight:700;
            color:#f4c542;
            margin-bottom:8px;
            display:flex;
            justify-content:center;
            align-items:center;
        }
        /* Botón de cierre eliminado a propósito: el despacho exige respuesta explícita (Cancelar/Aceptar) */
        .modal-box .modal-content {
            flex:1;
            overflow-y:auto;
            background:#0a1628;
            border-radius:12px;
            padding:16px 14px;
            margin:6px 0 14px;
            color:#d6e6f5;
            max-height:60vh;
        }
        .modal-box .modal-content .despacho-hora {
            font-size:1.1rem;
            font-weight:800;
            color:#f4c542;
            margin-bottom:10px;
        }
        .modal-box .modal-content .despacho-dir {
            font-size:0.95rem;
            line-height:1.4;
            color:#d6e6f5;
            margin-bottom:16px;
            word-break:break-word;
        }
        .modal-box .modal-content .despacho-pregunta {
            font-size:1rem;
            font-weight:700;
            text-align:center;
            color:#ffffff;
            padding-top:10px;
            border-top:1px solid #1e3a5a;
        }
        .modal-box .modal-buttons {
            display:flex;
            gap:14px;
            justify-content:center;
            margin-top:4px;
        }
        .modal-box .modal-buttons button {
            flex:1;
            padding:14px 10px;
            border:none;
            border-radius:40px;
            font-weight:800;
            font-size:1rem;
            cursor:pointer;
            transition:transform 0.1s;
            -webkit-tap-highlight-color:transparent;
            box-shadow:0 4px 8px rgba(0,0,0,0.4);
        }
        .modal-box .modal-buttons button:active { transform:scale(0.94); }
        .modal-box .modal-buttons .btn-accept { background:#0f7b3a; color:#e0f2e0; }
        .modal-box .modal-buttons .btn-reject { background:#7b1f1f; color:#fcd0d0; }

        @media (max-width:420px) { .btn-grid .btn { font-size:0.62rem; padding:10px 0; } .header .title { font-size:0.92rem; } table { font-size:0.75rem; } td, th { padding:6px 2px; } .tile .tile-count { font-size:1.1rem; } }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <div class="back">‹</div>
            <div class="title" id="zoneTitle">Z: CARGANDO...</div>
            <div class="filter">⏷</div>
        </div>
        <div class="header-strip"></div>
        <div class="subbar">
            <span id="updateTime">🕒 --:--</span>
            <span>
                <span class="dot" id="statusDot"></span>
                <span class="status-badge" id="statusLabel">Conectando...</span>
            </span>
        </div>

        <div class="content">
            <div class="btn-grid">
                <div class="btn" data-cmd="consulta_ub">CONSULTA UB</div>
                <div class="btn" data-cmd="pendientes">PENDIENTES</div>
                <div class="btn" data-cmd="ubicar_parada">UBICAR PARADA</div>
                <div class="btn" data-cmd="ubicacion">UBICACIÓN</div>
            </div>
            <div class="btn-grid" style="margin-top:6px;">
                <div class="btn" data-cmd="recibo">RECIBO</div>
                <div class="btn" data-cmd="mensajes">MENSAJES</div>
                <div class="btn" data-cmd="central">CENTRAL</div>
                <div class="btn" data-cmd="luces">LUCES</div>
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th style="text-align:left;padding-left:10px;">&nbsp;</th>
                            <th class="col-p">P</th>
                            <th class="col-z">Z</th>
                            <th class="col-s">S</th>
                            <th class="col-r">R</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>

            <div class="tiles">
                <div class="tile">
                    <div class="tile-icon">🛣️</div>
                    <div class="tile-count" id="pendientesCount">0</div>
                    <div class="tile-label">PARADA</div>
                </div>
                <!-- Tile SERVICIOS ahora es un botón -->
                <div class="tile" data-cmd="servicios" style="cursor:pointer;">
                    <div class="tile-icon">🧑‍✈️</div>
                    <div class="tile-count" id="serviciosCount">0</div>
                    <div class="tile-label">SERVICIOS</div>
                </div>
                <!-- Tile VEHÍCULOS sigue siendo botón -->
                <div class="tile" data-cmd="vehiculos" style="cursor:pointer;">
                    <div class="tile-icon">🚕</div>
                    <div class="tile-count" id="vehiculosCount">0</div>
                    <div class="tile-label">VEHÍCULOS</div>
                </div>
            </div>

            <div class="foot-strip">
                <div class="foot-icons">
                    <span title="Descargar">☁️⬇️</span>
                    <span title="Enviar">📨</span>
                    <span title="Escanear">🪪</span>
                </div>
                <div class="libre-btn" data-cmd="libre" id="libreBtn">LIBRE</div>
            </div>
        </div>

        <div class="toast" id="toast">💡 Esperando datos...</div>

        <!-- MODAL DE DESPACHO -->
        <div class="modal-overlay" id="modalOverlay">
            <div class="modal-box">
                <div class="modal-title">
                    <span>📨 DESPACHO</span>
                </div>
                <div class="modal-content" id="modalContent"></div>
                <div class="modal-buttons">
                    <button class="btn-reject" id="modalReject">❌ CANCELAR</button>
                    <button class="btn-accept" id="modalAccept">✅ ACEPTAR</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // -------------------------------------------------------------
        // CONFIGURACIÓN (Webhook actualizado)
        // -------------------------------------------------------------
        const WEBHOOK_URL = 'https://trigger.macrodroid.com/30c83d0a-a2d0-404b-9f16-48ed24896d46/smarttd-remote';
        const NTFY_TOPIC = 'smarttd-monitor';
        const NTFY_SSE_URL = `https://ntfy.sh/${NTFY_TOPIC}/sse`;

        // -------------------------------------------------------------
        // REFERENCIAS DOM
        // -------------------------------------------------------------
        const zoneTitleEl = document.getElementById('zoneTitle');
        const tableBody = document.getElementById('tableBody');
        const updateTimeEl = document.getElementById('updateTime');
        const pendientesEl = document.getElementById('pendientesCount');
        const serviciosEl = document.getElementById('serviciosCount');
        const vehiculosEl = document.getElementById('vehiculosCount');
        const toastEl = document.getElementById('toast');
        const statusDot = document.getElementById('statusDot');
        const statusLabel = document.getElementById('statusLabel');
        const libreBtn = document.getElementById('libreBtn');

        const modalOverlay = document.getElementById('modalOverlay');
        const modalContent = document.getElementById('modalContent');
        const modalAccept = document.getElementById('modalAccept');
        const modalReject = document.getElementById('modalReject');

        let connected = false;
        let lastMessageTime = 0;
        let eventSource = null;
        let audioCtx = null;

        // -------------------------------------------------------------
        // AUDIO (alerta acústica)
        // -------------------------------------------------------------
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume().catch(() => {});
            }
        }

        document.addEventListener('click', initAudio, { once: true });
        document.addEventListener('touchstart', initAudio, { once: true });

        function reproducirSonido() {
            try {
                initAudio();
                if (!audioCtx || audioCtx.state !== 'running') {
                    audioCtx.resume().then(() => tocarPitido()).catch(() => {});
                    return;
                }
                tocarPitido();
            } catch (e) {
                if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
            }
        }

        function tocarPitido() {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.value = 880;
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.6);
                setTimeout(() => {
                    try {
                        const osc2 = audioCtx.createOscillator();
                        const gain2 = audioCtx.createGain();
                        osc2.type = 'square';
                        osc2.frequency.value = 660;
                        gain2.gain.setValueAtTime(0.3, audioCtx.currentTime);
                        gain2.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
                        osc2.connect(gain2);
                        gain2.connect(audioCtx.destination);
                        osc2.start();
                        osc2.stop(audioCtx.currentTime + 0.5);
                    } catch (_) {}
                }, 300);
            } catch (e) {}
        }

        // -------------------------------------------------------------
        // FUNCIONES AUXILIARES
        // -------------------------------------------------------------
        function extractZoneName(titleText) {
            if (!titleText) return '';
            const match = titleText.match(/(?:[A-Z]:\s*)?(.+?)(?:\s*-\s*\d+)?$/i);
            return match ? match[1].trim().toUpperCase() : titleText.trim().toUpperCase();
        }

        function currentZoneName() {
            return extractZoneName(zoneTitleEl.textContent);
        }

        function updateTimestamp() {
            const now = new Date();
            updateTimeEl.textContent = '🕒 ' + now.toLocaleTimeString('es-ES', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }

        function setToast(msg, type = 'info') {
            toastEl.textContent = msg;
            toastEl.className = 'toast';
            if (type === 'success') toastEl.classList.add('success');
            else if (type === 'error') toastEl.classList.add('error');
            else if (type === 'warning') toastEl.classList.add('warning');
        }

        function setStatus(online, label) {
            connected = online;
            if (online) {
                statusDot.className = 'dot online';
                statusLabel.className = 'status-badge online';
                statusLabel.textContent = label || 'Conectado';
            } else {
                statusDot.className = 'dot offline';
                statusLabel.className = 'status-badge offline';
                statusLabel.textContent = label || 'NO CONECTADO';
            }
        }

        // -------------------------------------------------------------
        // MODAL DE DESPACHO
        // -------------------------------------------------------------
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // Convierte el texto crudo del despacho (ej: "10:20 ENSANCHE VALL\nAvenida...\nMadrid-Madrid\nTiene Despacho")
        // en la estructura visual de la app original: hora+zona, dirección, pregunta de confirmación.
        function renderDespacho(texto) {
            const lineas = texto.split('\n').map(l => l.trim()).filter(Boolean);

            const horaZonaIdx = lineas.findIndex(l => /^\d{1,2}:\d{2}\b/.test(l));
            const horaZona = horaZonaIdx >= 0 ? lineas[horaZonaIdx] : '';

            const direccion = lineas.filter((l, i) =>
                i !== horaZonaIdx && !/tiene despacho/i.test(l)
            );

            modalContent.innerHTML = `
                ${horaZona ? `<div class="despacho-hora">${escapeHtml(horaZona)}</div>` : ''}
                ${direccion.length ? `<div class="despacho-dir">${direccion.map(escapeHtml).join('<br>')}</div>` : ''}
                <div class="despacho-pregunta">Tiene Despacho, ¿Lo acepta?</div>
            `;
        }

        function mostrarModal(texto) {
            renderDespacho(texto);
            modalOverlay.classList.add('active');
        }

        function ocultarModal() {
            modalOverlay.classList.remove('active');
        }

        modalAccept.addEventListener('click', function() {
            sendCommand('despacho_aceptar');
            ocultarModal();
            setToast('✅ Despacho aceptado', 'success');
        });

        modalReject.addEventListener('click', function() {
            sendCommand('despacho_rechazar');
            ocultarModal();
            setToast('❌ Despacho rechazado', 'error');
        });

        // Nota: se retiró a propósito el cierre por botón "✕" y por toque fuera del modal.
        // El despacho requiere una respuesta explícita (Cancelar/Aceptar), igual que en la app original.

        // -------------------------------------------------------------
        // DETECCIÓN DE DESPACHO
        // -------------------------------------------------------------
        function contieneDespacho(valor) {
            if (typeof valor === 'string') {
                return valor.includes('Tiene Despacho');
            }
            if (Array.isArray(valor)) {
                return valor.some(item => contieneDespacho(item));
            }
            if (valor && typeof valor === 'object') {
                for (const key in valor) {
                    if (contieneDespacho(valor[key])) return true;
                }
            }
            return false;
        }

        function extraerTextoDespacho(valor, acumulado = '') {
            if (typeof valor === 'string') {
                if (valor.includes('Tiene Despacho')) {
                    return acumulado + (acumulado ? '\n' : '') + valor;
                }
                return acumulado;
            }
            if (Array.isArray(valor)) {
                let result = acumulado;
                for (const item of valor) {
                    result = extraerTextoDespacho(item, result);
                }
                return result;
            }
            if (valor && typeof valor === 'object') {
                let result = acumulado;
                for (const key in valor) {
                    if (key.toLowerCase() === 'distancia' || key.toLowerCase() === 'message') {
                        const sub = extraerTextoDespacho(valor[key], '');
                        if (sub) result += (result ? '\n' : '') + sub;
                    } else {
                        result = extraerTextoDespacho(valor[key], result);
                    }
                }
                return result;
            }
            return acumulado;
        }

        // -------------------------------------------------------------
        // RENDERIZADO TABLA
        // -------------------------------------------------------------
        function renderTable(data) {
            if (!Array.isArray(data) || data.length === 0) return;
            const currentZone = currentZoneName();
            let html = '';

            data.forEach(row => {
                const isCurrent = (row.name || '').trim().toUpperCase() === currentZone;
                const pClass = Number(row.P) > 0 ? 'num pos-p' : 'num';
                const zClass = Number(row.Z) > 0 ? 'num pos-z' : 'num';
                const sClass = Number(row.S) > 0 ? 'num pos-s' : 'num';
                const rClass = Number(row.R) > 0 ? 'num pos-r' : 'num';

                html += `<tr class="${isCurrent ? 'current-zone' : ''}">
                            <td class="row-label">${row.name || 'ZONA'}</td>
                            <td class="${pClass}">${row.P ?? 0}</td>
                            <td class="${zClass}">${row.Z ?? 0}</td>
                            <td class="${sClass}">${row.S ?? 0}</td>
                            <td class="${rClass}">${row.R ?? 0}</td>
                        </tr>`;
            });
            tableBody.innerHTML = html;

            const totalP = data.reduce((a, r) => a + (Number(r.P) || 0), 0);
            const totalZ = data.reduce((a, r) => a + (Number(r.Z) || 0), 0);
            const totalS = data.reduce((a, r) => a + (Number(r.S) || 0), 0);
            const totalR = data.reduce((a, r) => a + (Number(r.R) || 0), 0);

            pendientesEl.textContent = totalP;
            serviciosEl.textContent = totalS;
            vehiculosEl.textContent = totalZ + totalR;
        }

        // -------------------------------------------------------------
        // PARSEO
        // -------------------------------------------------------------
        function parseMacroDroidInput(inputData) {
            if (typeof inputData === 'string') {
                const trimmed = inputData.trim();
                if (trimmed.startsWith('{') || trimmed.startsWith('[')) {
                    try {
                        inputData = JSON.parse(trimmed);
                    } catch (e) {
                        return null;
                    }
                } else {
                    return null;
                }
            }

            if (!inputData || typeof inputData !== 'object') return null;

            const normalized = {};
            for (const key in inputData) {
                let newKey = key;
                if (key.startsWith('ifac.td.smarttd:id/')) {
                    newKey = key.replace('ifac.td.smarttd:id/', '');
                }
                normalized[newKey] = inputData[key];
            }

            if (normalized.tvHeaderText) {
                zoneTitleEl.textContent = normalized.tvHeaderText;
            }
            if (normalized.txInfoStateBottomBar) {
                libreBtn.textContent = normalized.txInfoStateBottomBar.toUpperCase();
            }

            const rowsMap = {};

            function getRow(idx) {
                if (!rowsMap[idx]) {
                    rowsMap[idx] = { name: '', P: 0, Z: 0, S: 0, R: 0 };
                }
                return rowsMap[idx];
            }

            for (const key in normalized) {
                const val = normalized[key];
                let idx = -1;
                if (key === 'tvZoneName') {
                    idx = 0;
                } else if (key.startsWith('tvZoneName$')) {
                    const match = key.match(/\$(\d+)$/);
                    if (match) {
                        const num = parseInt(match[1], 10);
                        idx = Math.max(0, num - 1);
                    }
                }
                if (idx >= 0 && val && typeof val === 'string' && val.trim() !== '') {
                    getRow(idx).name = val.trim();
                }
            }

            for (const key in normalized) {
                const match = key.match(/\$(\d+)$/);
                if (!match) continue;
                const num = parseInt(match[1], 10);
                const idx = Math.max(0, num - 2);
                const val = normalized[key];
                if (key.startsWith('tvOnStop')) {
                    getRow(idx).P = Number(val) || 0;
                } else if (key.startsWith('tvOnZone')) {
                    getRow(idx).Z = Number(val) || 0;
                } else if (key.startsWith('tvHired')) {
                    getRow(idx).S = Number(val) || 0;
                } else if (key.startsWith('tvTrips')) {
                    getRow(idx).R = Number(val) || 0;
                }
            }

            const result = Object.keys(rowsMap)
                .map(Number)
                .sort((a, b) => a - b)
                .map(idx => rowsMap[idx])
                .filter(row => row.name !== '');

            return result.length > 0 ? result : null;
        }

        // -------------------------------------------------------------
        // ENVÍO DE COMANDOS
        // -------------------------------------------------------------
        function sendCommand(cmd) {
            if (!cmd) return;
            const url = WEBHOOK_URL + '?cmd=' + encodeURIComponent(cmd);
            setToast(`📤 Enviando "${cmd}"...`, 'info');
            fetch(url, { method: 'GET', mode: 'no-cors', cache: 'no-cache' })
                .then(() => setToast(`✅ Comando "${cmd}" enviado`, 'success'))
                .catch(err => setToast(`❌ Error: ${err.message}`, 'error'));
        }

        document.querySelectorAll('[data-cmd]').forEach(btn => {
            btn.addEventListener('click', function() {
                const cmd = this.getAttribute('data-cmd');
                this.style.transform = 'scale(0.92)';
                setTimeout(() => this.style.transform = '', 150);
                sendCommand(cmd);
            });
        });

        // -------------------------------------------------------------
        // CONEXIÓN A NTFY
        // -------------------------------------------------------------
        function connectToNtfy() {
            setToast('🔄 Conectando a ntfy.sh...', 'info');
            setStatus(false, 'Conectando...');

            try {
                if (eventSource) {
                    eventSource.close();
                    eventSource = null;
                }

                eventSource = new EventSource(NTFY_SSE_URL);

                eventSource.onopen = function() {
                    setToast('✅ Conectado, esperando datos...', 'success');
                    setStatus(true, 'Conectado');
                    lastMessageTime = Date.now();
                };

                eventSource.onmessage = function(event) {
                    try {
                        const raw = event.data;
                        if (raw === 'ping' || raw === 'keepalive') return;
                        lastMessageTime = Date.now();

                        let esDespacho = false;
                        let textoDespacho = '';

                        let parsedJson = null;
                        try {
                            parsedJson = JSON.parse(raw);
                        } catch (_) {}

                        if (parsedJson) {
                            esDespacho = contieneDespacho(parsedJson);
                            if (esDespacho) {
                                textoDespacho = extraerTextoDespacho(parsedJson);
                                if (!textoDespacho) {
                                    textoDespacho = JSON.stringify(parsedJson, null, 2);
                                }
                            }
                        } else {
                            if (typeof raw === 'string' && raw.includes('Tiene Despacho')) {
                                esDespacho = true;
                                textoDespacho = raw;
                            }
                        }

                        if (esDespacho) {
                            mostrarModal(textoDespacho);
                            reproducirSonido();
                            setToast('📨 ¡Nuevo despacho!', 'warning');
                            return;
                        }

                        let payload = null;
                        if (parsedJson) {
                            if (parsedJson.message) {
                                if (typeof parsedJson.message === 'string') {
                                    const trimmed = parsedJson.message.trim();
                                    if (trimmed.startsWith('{') || trimmed.startsWith('[')) {
                                        try {
                                            payload = JSON.parse(trimmed);
                                        } catch (_) {
                                            payload = trimmed;
                                        }
                                    } else {
                                        return;
                                    }
                                } else {
                                    payload = parsedJson.message;
                                }
                            } else {
                                payload = parsedJson;
                            }
                        } else {
                            payload = raw;
                        }

                        if (!payload) return;

                        const parsedData = parseMacroDroidInput(payload);
                        if (parsedData && parsedData.length > 0) {
                            renderTable(parsedData);
                            updateTimestamp();
                            setStatus(true, 'Conectado');
                            setToast(`✅ ${parsedData.length} filas cargadas`, 'success');
                        } else {
                            if (typeof payload === 'object') {
                                setToast('⚠️ Datos no reconocidos', 'warning');
                            }
                        }
                    } catch (e) {}
                };

                eventSource.onerror = function() {
                    setStatus(false, 'NO CONECTADO');
                    setToast('⚠️ Error en conexión ntfy', 'error');
                    setTimeout(() => {
                        if (eventSource && eventSource.readyState === EventSource.CLOSED) {
                            connectToNtfy();
                        }
                    }, 10000);
                };

                setInterval(() => {
                    if (connected && Date.now() - lastMessageTime > 15000) {
                        setStatus(false, 'NO CONECTADO');
                        setToast('⏳ Sin datos desde hace 15s', 'warning');
                    }
                }, 5000);

            } catch (e) {
                setToast('❌ Error al conectar: ' + e.message, 'error');
                setStatus(false, 'NO CONECTADO');
            }
        }

        // -------------------------------------------------------------
        // PRUEBA MANUAL
        // -------------------------------------------------------------
        let titleClicks = 0;
        zoneTitleEl.addEventListener('click', function() {
            titleClicks++;
            if (titleClicks >= 3) {
                titleClicks = 0;
                const testMsg = `10:20 ENSANCHE VALL
Avenida del Ensanche de Vallecas, 102
Madrid-Madrid
Tiene Despacho`;
                mostrarModal(testMsg);
                reproducirSonido();
                setToast('🔔 Prueba de despacho', 'warning');
            }
        });

        // -------------------------------------------------------------
        // INICIO
        // -------------------------------------------------------------
        renderTable([]);
        updateTimestamp();
        connectToNtfy();
        setInterval(updateTimestamp, 2000);

        document.addEventListener('click', initAudio, { once: true });
        document.addEventListener('touchstart', initAudio, { once: true });

        // -------------------------------------------------------------
        // PWA: registro del service worker
        // -------------------------------------------------------------
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .then(reg => console.log('SW registrado, scope:', reg.scope))
                    .catch(err => console.warn('Fallo registro SW:', err));
            });
        }
    </script>
